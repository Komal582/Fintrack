<!DOCTYPE html>

<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <title>Update Profile - FinTrack</title>
  <style>
    body {
        background-color: #e6f2ff;
        font-family: Arial, sans-serif;
        padding: 40px;
    }
    .container {
        width: 380px;
        background: white;
        padding: 25px;
        margin: auto;
        border-radius: 12px;
        box-shadow: 0 0 12px rgba(0,0,0,0.2);
        text-align: center;
    }
    h2 {
        color: #004080;
        margin-bottom: 20px;
    }
    input {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
    }
    button {
        width: 100%;
        padding: 12px;
        border: none;
        background-color: #004080;
        color: white;
        font-size: 15px;
        border-radius: 6px;
        cursor: pointer;
    }
    button:hover {
        background-color: #003366;
    }
    .back {
        margin-top: 15px;
        display: inline-block;
        color: #004080;
        text-decoration: none;
    }
  </style>
</head>
<script>
    function updateUser(){
        console.log("IN Update User HTML");
         const data ={
            username : document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            role:document.getElementById("role").value
         };
         console.log(data);
         fetch("/user/updateUser",{
            method:'PUT',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify(data)
         }).then(response => response.text())
         .then(data =>{
            document.getElementById("message").innerHTML =data;
         })
    }
</script>
<body>

<div class="container">
  <h2>Update Profile</h2>
 <p id="message" style="color:green"></p>
  
 <div>

    <input type="text" name="UserName" id="name" placeholder="Enter new name" required>

    <input type="email" name="email"  id="email" placeholder="Enter new email" required>

    <input type="password" name="Password" id="password" placeholder="Enter new password" required>

    <input type="text" name ="role" id ="role" placeholder="Enter the role" required>

    <button onclick="updateUser()">Update Profile</button>
</div>
  

  <a href="/user/dashboard" class="back">⬅ Back to Dashboard</a>
</div>

</body>
</html>
